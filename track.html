<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Package Tracking</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- Google Font (optional, for polish) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    
</head>
<body>

    <div class="tracking-module-wrapper">
        <div class="tracking-card">

            <!-- ─── FORM ─── -->
            <form class="fxg-form" id="PageTrackingModule-large" novalidate>
                <div class="fxg-field">
                    <label class="fxg-field__label" for="trackingModuleTrackingNum">
                        Tracking ID
                    </label>
                    <input
                    id="trackingModuleTrackingNum"
                    tabindex="0"
                    type="text"
                    class="fxg-field__input-text"
                    name="trackingNumber"
                    placeholder="e.g. 1Z999AA10123456784"
                    aria-required="true"
                    aria-describedby="errorMessage"
                    data-errmsg="Please enter at least one tracking number."
                    />
                    <div class="fxg-field__error_text" id="errorMessage" role="alert">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" y1="8" x2="12" y2="12" />
                            <line x1="12" y1="16" x2="12.01" y2="16" />
                        </svg>
                        <span id="errorText">Tracking ID not found.</span>
                    </div>
                    <input type="hidden" id="dataAnalyticsTrackModule" value="hero| Tracking" />
                    <input type="hidden" id="trackURL" />
                    <input type="hidden" id="trackPlaceholder" value="TRACKING ID" />
                </div>
                <button type="submit" aria-label="Track your package" class="cc-aem-c-button" id="trackBtn">
                    Track
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </button>
            </form>

            <!-- ─── RESULTS ─── -->
            <div id="trackingResults" class="tracking-results" role="region" aria-live="polite" aria-atomic="true">

                <!-- ── 1. SHIPMENT OVERVIEW ── -->
                <div class="result-section">
                    <div class="result-section__header">
                        <span class="icon">📦</span> Shipment Overview
                    </div>
                    <div class="info-grid info-grid--3">
                        <div class="info-item">
                            <span class="info-item__label">Tracking ID</span>
                            <span class="info-item__value" id="result_tracking_id">—</span>
                        </div>
                        <div class="info-item">
                            <span class="info-item__label">Status</span>
                            <span class="info-item__value">
                                <span class="status-badge" id="result_status">—</span>
                            </span>
                        </div>
                        <div class="info-item">
                            <span class="info-item__label">Expected Delivery</span>
                            <span class="info-item__value" id="result_expected_delivery">—</span>
                        </div>
                        <div class="info-item">
                            <span class="info-item__label">Origin</span>
                            <span class="info-item__value" id="result_origin">—</span>
                        </div>
                        <div class="info-item">
                            <span class="info-item__label">Destination</span>
                            <span class="info-item__value" id="result_destination">—</span>
                        </div>
                    </div>
                </div>

                <!-- ── 2. SERVICES ── -->
                <div class="result-section">
                    <div class="result-section__header">
                        <span class="icon">🚚</span> Services
                    </div>
                    <div class="info-grid info-grid--1">
                        <div class="info-item">
                            <span class="info-item__label">Service Type</span>
                            <span class="info-item__value">
                                <span class="service-chip" id="result_service">
                                    <span class="emoji">📬</span> <span id="result_service_text">—</span>
                                </span>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- ── 3. PACKAGE DETAILS ── -->
                <div class="result-section">
                    <div class="result-section__header">
                        <span class="icon">📐</span> Package Details
                    </div>
                    <div class="info-grid info-grid--3">
                        <div class="info-item">
                            <span class="info-item__label">Weight</span>
                            <span class="info-item__value" id="result_weight">—</span>
                        </div>
                        <div class="info-item">
                            <span class="info-item__label">Dimensions</span>
                            <span class="info-item__value" id="result_dimensions">—</span>
                        </div>
                        <div class="info-item">
                            <span class="info-item__label">Signed By</span>
                            <span class="info-item__value" id="result_signed_by">—</span>
                        </div>
                    </div>
                </div>

                <!-- ── HISTORY ── -->
                <div class="result-section" style="margin-bottom:18px;">
                    <div class="result-section__header">
                        <span class="icon">📜</span> Tracking History
                    </div>
                    <ul class="history-list" id="result_history">
                        <li style="color:#94a3b8; font-size:14px; padding:8px 0; list-style:none;">No history available</li>
                    </ul>
                </div>

                <!-- ── MAP ── -->
                <div class="result-section" style="margin-bottom:0; padding-bottom:4px;">
                    <div class="result-section__header" style="margin-bottom:12px;">
                        <span class="icon">🗺️</span> Route Map
                    </div>
                    <div class="map-wrapper">
                        <div id="trackingMap"></div>
                        <div id="mapErrorMessage"></div>
                    </div>
                </div>

            </div>
            <!-- /results -->

        </div>
        <!-- /card -->
    </div>
    <!-- /wrapper -->


    <style>
        /* ── Reset & base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f4f6fa;
            color: #1a1a2e;
            padding: 24px 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .tracking-module-wrapper {
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
        }

        /* ── Card container ── */
        .tracking-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.03);
            padding: 32px 28px;
            transition: box-shadow 0.25s;
        }

        @media (max-width: 480px) {
            .tracking-card {
                padding: 20px 16px;
                border-radius: 16px;
            }
        }

        /* ── Form ── */
        .fxg-form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            align-items: flex-end;
        }

        .fxg-field {
            flex: 1 1 240px;
            min-width: 180px;
            position: relative;
        }

        .fxg-field__label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #5a6a7e;
            margin-bottom: 5px;
        }

        .fxg-field__input-text {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #fafbfc;
            color: #1a1a2e;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }

        .fxg-field__input-text:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
        }

        .fxg-field__input-text::placeholder {
            color: #a0aec0;
            font-weight: 400;
            font-size: 14px;
            letter-spacing: 0.02em;
        }

        .fxg-field__error_text {
            display: none;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #dc2626;
            background: #fef2f2;
            padding: 8px 14px;
            border-radius: 10px;
            border-left: 4px solid #dc2626;
            align-items: center;
            gap: 8px;
        }

        .fxg-field__error_text svg {
            flex-shrink: 0;
            width: 14px;
            height: 14px;
            fill: #dc2626;
        }

        .fxg-field__error_text.show {
            display: flex;
        }

        /* ── Track button ── */
        .cc-aem-c-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 32px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.20);
            flex-shrink: 0;
            height: 50px;
            min-width: 120px;
        }

        .cc-aem-c-button:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.30);
        }

        .cc-aem-c-button:active {
            transform: scale(0.97);
        }

        .cc-aem-c-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .cc-aem-c-button svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2.5;
            flex-shrink: 0;
        }

        @media (max-width: 480px) {
            .cc-aem-c-button {
                width: 100%;
                justify-content: center;
            }
            .fxg-field {
                flex: 1 1 100%;
                min-width: unset;
            }
        }

        /* ── Results container ── */
        .tracking-results {
            display: none;
            margin-top: 32px;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tracking-results.visible {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Section cards ── */
        .result-section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px 22px;
            margin-bottom: 18px;
            border: 1px solid #edf2f7;
            transition: background 0.2s;
        }

        .result-section:last-child {
            margin-bottom: 0;
        }

        .result-section__header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #64748b;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9edf3;
        }

        .result-section__header .icon {
            font-size: 18px;
            line-height: 1;
        }

        /* ── Grids ── */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px 24px;
        }

        .info-grid--3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .info-grid--2 {
            grid-template-columns: repeat(2, 1fr);
        }

        .info-grid--1 {
            grid-template-columns: 1fr;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 4px 0;
        }

        .info-item__label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #7f8fa3;
        }

        .info-item__value {
            font-size: 15px;
            font-weight: 500;
            color: #0f172a;
            word-break: break-word;
        }

        .info-item__value .highlight {
            font-weight: 600;
        }

        /* ── Status badge ── */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 16px 4px 12px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            background: #e9edf3;
            color: #334155;
            width: fit-content;
        }

        .status-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
            flex-shrink: 0;
        }

        .status-badge.delivered {
            background: #dcfce7;
            color: #166534;
        }
        .status-badge.delivered::before {
            background: #22c55e;
        }

        .status-badge.in-transit {
            background: #fef3c7;
            color: #92400e;
        }
        .status-badge.in-transit::before {
            background: #f59e0b;
        }

        .status-badge.pending {
            background: #dbeafe;
            color: #1e40af;
        }
        .status-badge.pending::before {
            background: #3b82f6;
        }

        .status-badge.exception {
            background: #fee2e2;
            color: #991b1b;
        }
        .status-badge.exception::before {
            background: #ef4444;
        }

        /* ── Services section ── */
        .service-chip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px 10px 16px;
            background: #ffffff;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
            font-weight: 600;
            font-size: 15px;
            color: #0f172a;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }

        .service-chip .emoji {
            font-size: 20px;
        }

        /* ── History ── */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 0;
            margin: 0;
            list-style: none;
            position: relative;
            padding-left: 28px;
        }

        .history-list::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 6px;
            bottom: 6px;
            width: 2px;
            background: #dce1e9;
            border-radius: 4px;
        }

        .history-item {
            position: relative;
            padding: 12px 0 12px 22px;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px 16px;
            animation: fadeItem 0.4s ease-out forwards;
            opacity: 0;
        }

        .history-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .history-item::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 18px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #2563eb;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 2px #2563eb;
        }

        .history-item:last-child::before {
            background: #22c55e;
            box-shadow: 0 0 0 2px #22c55e;
        }

        .history-item__time {
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;
            flex: 0 0 auto;
            min-width: 140px;
        }

        .history-item__location {
            font-size: 14px;
            color: #334155;
            flex: 1 1 auto;
        }

        .history-item__location .pin {
            margin-right: 4px;
        }

        .history-item__desc {
            font-size: 13px;
            color: #64748b;
            flex: 0 0 auto;
            width: 100%;
            padding-left: 0;
            margin-top: 1px;
        }

        @media (max-width: 480px) {
            .history-item {
                padding: 10px 0 10px 18px;
            }
            .history-item__time {
                min-width: 100px;
                font-size: 12px;
            }
            .history-item__location {
                font-size: 13px;
            }
            .history-item__desc {
                font-size: 12px;
            }
            .history-list {
                padding-left: 22px;
            }
            .history-list::before {
                left: 6px;
            }
            .history-item::before {
                left: -20px;
                width: 10px;
                height: 10px;
            }
        }

        @keyframes fadeItem {
            from {
                opacity: 0;
                transform: translateX(-6px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ── Map ── */
        .map-wrapper {
            margin-top: 20px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            background: #eef2f6;
            position: relative;
            min-height: 220px;
        }

        #trackingMap {
            width: 100%;
            height: 260px;
            background: #eef2f6;
        }

        #mapErrorMessage {
            display: none;
            padding: 12px 16px;
            font-size: 14px;
            color: #dc2626;
            background: #fef2f2;
            border-top: 1px solid #fecaca;
        }

        #mapErrorMessage.show {
            display: block;
        }

        @media (max-width: 480px) {
            #trackingMap {
                height: 200px;
            }
        }

        /* ── Responsive grid adjustments ── */
        @media (max-width: 820px) {
            .info-grid--3 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 560px) {
            .info-grid--3 {
                grid-template-columns: 1fr;
            }
            .info-grid--2 {
                grid-template-columns: 1fr;
            }
            .result-section {
                padding: 16px 14px;
            }
            .service-chip {
                width: 100%;
                justify-content: center;
                padding: 10px 16px;
            }
            .tracking-card {
                padding: 16px 12px;
            }
        }

        /* ── Utility ── */
        .mt-2 {
            margin-top: 8px;
        }
        .text-muted {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 400;
        }
        .flex-wrap {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        /* ── Hidden helper for map init ── */
        .hidden {
            display: none !important;
        }

        /* ── Leaflet overrides ── */
        .leaflet-popup-content-wrapper {
            border-radius: 12px !important;
            font-family: 'Inter', sans-serif !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08) !important;
        }
        .leaflet-popup-content {
            font-size: 14px !important;
            padding: 8px 4px !important;
            font-weight: 500;
        }
        .leaflet-popup-content b {
            color: #1a1a2e;
        }

        /* ── Loading spinner ── */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>


    <script>
        (function() {
            'use strict';

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  INLINE TRACKING DATA
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            const INLINE_DATA = {
                "123456789012": {
                    "tracking_id": "1Z999AA10123456784",
                    "status": "In Transit",
                    "origin": "Memphis, TN",
                    "destination": "Seattle, WA",
                    "service": "FedEx Ground",
                    "expected_delivery": "2026-08-05",
                    "history": [
                        { "timestamp": "2026-08-02T10:12:00Z", "location": "Memphis, TN",
                        "desc": "Departed FedEx facility" },
                        { "timestamp": "2026-08-03T02:30:00Z", "location": "Nashville, TN",
                            "desc": "Arrived at FedEx station" },
                        { "timestamp": "2026-08-04T09:15:00Z", "location": "Chicago, IL",
                        "desc": "In transit — scanned" }
                    ],
                    "weight": "4.2 lb",
                    "dimensions": "10×6×4 in",
                    "signed_by": null
                },
                "TRK1234567890": {
                    "tracking_id": "TRK1234567890",
                    "status": "Delivered",
                    "origin": "Lagos, NG",
                    "destination": "Abuja, NG",
                    "service": "FedEx Express",
                    "expected_delivery": "2026-07-30",
                    "history": [
                        { "timestamp": "2026-07-28T08:00:00Z", "location": "Lagos, NG",
                        "desc": "Picked up — shipment received" },
                        { "timestamp": "2026-07-29T11:30:00Z", "location": "Ibadan, NG",
                            "desc": "Arrived at sort facility" },
                        { "timestamp": "2026-07-30T14:20:00Z", "location": "Abuja, NG",
                            "desc": "Delivered — signature captured" }
                    ],
                    "weight": "1.2 kg",
                    "dimensions": "8×5×3 in",
                    "signed_by": "A. Okafor"
                }
            };

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  DOM REFS
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            const form = document.getElementById('PageTrackingModule-large');
            const input = document.getElementById('trackingModuleTrackingNum');
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const resultsContainer = document.getElementById('trackingResults');
            const submitBtn = document.getElementById('trackBtn');
            const mapContainer = document.getElementById('trackingMap');
            const mapErrorMsg = document.getElementById('mapErrorMessage');

            const result = {
                tracking_id: document.getElementById('result_tracking_id'),
                status: document.getElementById('result_status'),
                service_text: document.getElementById('result_service_text'),
                service_chip: document.querySelector('.service-chip'),
                origin: document.getElementById('result_origin'),
                destination: document.getElementById('result_destination'),
                expected_delivery: document.getElementById('result_expected_delivery'),
                weight: document.getElementById('result_weight'),
                dimensions: document.getElementById('result_dimensions'),
                signed_by: document.getElementById('result_signed_by'),
                history: document.getElementById('result_history')
            };

            let trackingData = null;
            let map = null;
            let mapInitialized = false;

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  HELPERS
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            function formatDate(iso) {
                if (!iso) return '—';
                try {
                    const d = new Date(iso);
                    if (isNaN(d)) return iso;
                    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                } catch (_) { return iso; }
            }

            function formatDateTime(iso) {
                if (!iso) return '—';
                try {
                    const d = new Date(iso);
                    if (isNaN(d)) return iso;
                    return d.toLocaleString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                } catch (_) { return iso; }
            }

            function getStatusClass(status) {
                const s = (status || '').toLowerCase();
                if (s.includes('delivered')) return 'delivered';
                if (s.includes('transit') || s.includes('in transit')) return 'in-transit';
                if (s.includes('pending')) return 'pending';
                if (s.includes('exception') || s.includes('delay')) return 'exception';
                return '';
            }

            function setButtonLoading(loading) {
                if (!submitBtn) return;
                if (loading) {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<span class="spinner"></span> Tracking…';
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML =
                        'Track <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7" /></svg>';
                }
            }

            function showError(msg) {
                errorText.textContent = msg;
                errorDiv.classList.add('show');
                resultsContainer.classList.remove('visible');
                resultsContainer.style.display = 'none';
            }

            function hideError() {
                errorDiv.classList.remove('show');
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  GEOCODING
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            async function geocodeLocation(location) {
                if (!location) return null;
                const url =
                    `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(location)}&format=json&limit=1`;
                try {
                    const resp = await fetch(url, { headers: { 'User-Agent': 'TrackingModule/1.0' } });
                    if (!resp.ok) throw new Error('Geocoding error');
                    const data = await resp.json();
                    if (data && data.length > 0) {
                        return {
                            lat: parseFloat(data[0].lat),
                            lng: parseFloat(data[0].lon),
                            display: data[0].display_name
                        };
                    }
                } catch (_) { /* ignore */ }
                return null;
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  MAP
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            async function updateMap(originStr, destStr) {
                if (map) { map.remove();
                    map = null; }
                mapErrorMsg.classList.remove('show');
                mapErrorMsg.textContent = '';

                const [originGeo, destGeo] = await Promise.all([
                    geocodeLocation(originStr),
                    geocodeLocation(destStr)
                ]);

                if (!originGeo && !destGeo) {
                    mapErrorMsg.textContent = '📍 Could not map locations — geocoding service temporarily unavailable.';
                    mapErrorMsg.classList.add('show');
                    return;
                }

                const coords = [];
                if (originGeo) coords.push([originGeo.lat, originGeo.lng]);
                if (destGeo) coords.push([destGeo.lat, destGeo.lng]);

                const center = coords.length > 0 ? coords[0] : [0, 0];
                map = L.map(mapContainer, {
                    center: center,
                    zoom: 13,
                    zoomControl: true,
                    attributionControl: true
                });

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }).addTo(map);

                if (coords.length === 2) {
                    map.fitBounds(coords, { padding: [50, 50] });
                } else if (coords.length === 1) {
                    map.setView(coords[0], 10);
                }

                const originIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: '<div style="background:#22c55e; width:18px; height:18px; border-radius:50%; border:2.5px solid #fff; box-shadow:0 0 0 2px #22c55e, 0 2px 8px rgba(0,0,0,0.15);"></div>',
                    iconSize: [18, 18],
                    iconAnchor: [9, 9]
                });
                const destIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: '<div style="background:#ef4444; width:18px; height:18px; border-radius:50%; border:2.5px solid #fff; box-shadow:0 0 0 2px #ef4444, 0 2px 8px rgba(0,0,0,0.15);"></div>',
                    iconSize: [18, 18],
                    iconAnchor: [9, 9]
                });

                const group = L.layerGroup().addTo(map);
                if (originGeo) {
                    L.marker([originGeo.lat, originGeo.lng], { icon: originIcon })
                        .bindPopup(`<b>📍 Origin</b><br>${originGeo.display || originStr}`)
                        .addTo(group);
                }
                if (destGeo) {
                    L.marker([destGeo.lat, destGeo.lng], { icon: destIcon })
                        .bindPopup(`<b>📌 Destination</b><br>${destGeo.display || destStr}`)
                        .addTo(group);
                }
                if (originGeo && destGeo) {
                    L.polyline([
                        [originGeo.lat, originGeo.lng],
                        [destGeo.lat, destGeo.lng]
                    ], {
                        color: '#2563eb',
                        weight: 3.5,
                        opacity: 0.5,
                        dashArray: '6, 10'
                    }).addTo(group);
                }

                // Force map to recalculate after a tick
                setTimeout(() => { if (map) map.invalidateSize(); }, 200);
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  DISPLAY RESULTS
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            function displayTrackingResults(tracking) {
                // ── Overview ──
                result.tracking_id.textContent = tracking.tracking_id || '—';
                result.origin.textContent = tracking.origin || '—';
                result.destination.textContent = tracking.destination || '—';
                result.expected_delivery.textContent = formatDate(tracking.expected_delivery);

                // ── Status ──
                const statusVal = tracking.status || 'Unknown';
                const statusEl = result.status;
                statusEl.textContent = statusVal;
                statusEl.className = 'status-badge';
                const cls = getStatusClass(statusVal);
                if (cls) statusEl.classList.add(cls);

                // ── Services ──
                const svc = tracking.service || 'Standard Shipping';
                result.service_text.textContent = svc;
                // Set an emoji hint based on service name
                const chip = result.service_chip;
                const emojiSpan = chip.querySelector('.emoji');
                const lower = svc.toLowerCase();
                if (lower.includes('express')) emojiSpan.textContent = '⚡';
                else if (lower.includes('ground')) emojiSpan.textContent = '🚛';
                else if (lower.includes('overnight')) emojiSpan.textContent = '🌙';
                else if (lower.includes('international')) emojiSpan.textContent = '🌍';
                else emojiSpan.textContent = '📬';

                // ── Package Details ──
                result.weight.textContent = tracking.weight || '—';
                result.dimensions.textContent = tracking.dimensions || '—';
                result.signed_by.textContent = tracking.signed_by || 'Pending';

                // ── History ──
                const historyContainer = result.history;
                historyContainer.innerHTML = '';
                if (tracking.history && Array.isArray(tracking.history) && tracking.history.length > 0) {
                    tracking.history.forEach((item, idx) => {
                        const li = document.createElement('li');
                        li.className = 'history-item';
                        li.style.animationDelay = (0.08 * idx) + 's';
                        li.innerHTML = `
                            <span class="history-item__time">${formatDateTime(item.timestamp)}</span>
                            <span class="history-item__location"><span class="pin">📍</span> ${item.location || '—'}</span>
                            <span class="history-item__desc">${item.desc || ''}</span>
                        `;
                        historyContainer.appendChild(li);
                    });
                } else {
                    const li = document.createElement('li');
                    li.style.cssText =
                        'color:#94a3b8; font-size:14px; padding:8px 0; list-style:none; text-align:center;';
                    li.textContent = 'No tracking history available.';
                    historyContainer.appendChild(li);
                }

                // ── Show container ──
                resultsContainer.style.display = 'block';
                // Force reflow for animation
                void resultsContainer.offsetWidth;
                resultsContainer.classList.add('visible');

                // ── Map ──
                mapContainer.style.display = 'block';
                setTimeout(() => {
                    updateMap(tracking.origin, tracking.destination);
                }, 150);
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  LOAD DATA
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            async function loadTrackingData() {
                try {
                    const resp = await fetch('./tracking.json');
                    if (resp.ok) {
                        const data = await resp.json();
                        if (data && typeof data === 'object') {
                            trackingData = data;
                            return;
                        }
                    }
                } catch (_) { /* fallback */ }
                trackingData = INLINE_DATA;
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  HANDLE SUBMIT
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            async function handleSubmit(event) {
                event.preventDefault();
                hideError();
                const trackingId = input.value.trim().toUpperCase();
                if (!trackingId) {
                    showError('Please enter a tracking number.');
                    return;
                }
                if (!trackingData) await loadTrackingData();
                if (!trackingData[trackingId]) {
                    showError('Tracking ID not found in our system.');
                    return;
                }
                // Redirect with query param
                const url = new URL(window.location.href);
                url.searchParams.set('trackingNumber', trackingId);
                window.location.href = url.toString();
            }

            async function onFormSubmit(event) {
                event.preventDefault();
                setButtonLoading(true);
                try {
                    await handleSubmit(event);
                } catch (err) {
                    console.error(err);
                    showError('Error retrieving tracking information.');
                } finally {
                    setButtonLoading(false);
                }
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  CHECK URL ON LOAD
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            async function checkUrlAndDisplay() {
                const params = new URLSearchParams(window.location.search);
                const trackingId = params.get('trackingNumber');
                if (trackingId) {
                    if (!trackingData) await loadTrackingData();
                    const tracking = trackingData[trackingId];
                    if (tracking) {
                        input.value = trackingId;
                        displayTrackingResults(tracking);
                        // Scroll to results after a beat
                        setTimeout(() => {
                            resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }, 300);
                    } else {
                        showError('Tracking ID not found in our system.');
                    }
                }
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            //  INIT
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            async function init() {
                await loadTrackingData();
                form.addEventListener('submit', onFormSubmit);

                // Clear error on input
                input.addEventListener('input', () => {
                    if (errorDiv.classList.contains('show')) hideError();
                });

                // Handle Enter key on input (form will catch it anyway)
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        form.dispatchEvent(new Event('submit'));
                    }
                });

                await checkUrlAndDisplay();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
